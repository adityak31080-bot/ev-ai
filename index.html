<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV AI</title>
<style>
body {
  margin: 0;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px;
  background: #171f36;
  text-align: center;
}
h1 { color: #8b80ff; }
#chat {
  padding: 15px;
  padding-bottom: 90px;
}
.msg {
  padding: 12px;
  margin: 12px 0;
  border-radius: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.bot { background: #202b45; }
.user {
  background: #5146e5;
  margin-left: 35px;
}
form {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  padding: 10px;
  background: #111827;
  gap: 8px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #555;
  background: #202b45;
  color: white;
}
button {
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #6d5dfc;
  color: white;
  font-weight: bold;
}
</style>
</head>
<body>
<header>
  <h1>✨ EV AI</h1>
  <p>Your personal AI assistant</p>
</header>

<div id="chat">
  <div class="msg bot">
    Hi! I'm EV 🤖 Ask me anything!
  </div>
</div>

<form id="form">
  <input id="message" placeholder="Message EV..." required>
  <button id="send">Send</button>
</form>

<script>
const form = document.getElementById("form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  const reply = document.createElement("div");
  reply.className = "msg bot";
  reply.textContent = "Thinking...";
  chat.appendChild(reply);

  try {
    const response = await fetch(
      "/.netlify/functions/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message })
      }
    );

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || "Connection failed");
    }

    reply.textContent = data.reply;
  } catch (error) {
    reply.textContent =
      "EV couldn't connect yet. We still need to set up the AI server!";
  }
});
</script>
</body>
  </html>
